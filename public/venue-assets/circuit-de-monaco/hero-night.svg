<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" role="img" aria-labelledby="title description">
  <title id="title">Circuit de Monaco</title>
  <desc id="description">An original vector portrait of Monaco's street circuit winding between the principality and its yacht-lined harbour.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#10202b"/><stop offset=".58" stop-color="#26373d"/><stop offset="1" stop-color="#b48e62"/></linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#183c48"/><stop offset=".55" stop-color="#0d2934"/><stop offset="1" stop-color="#071b25"/></linearGradient>
    <linearGradient id="city" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e1d5bd"/><stop offset="1" stop-color="#786c5f"/></linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#3b4140"/><stop offset="1" stop-color="#181d1e"/></linearGradient>
    <radialGradient id="sunset" cx="74%" cy="34%" r="48%"><stop stop-color="#edcb8a" stop-opacity=".34"/><stop offset="1" stop-color="#edcb8a" stop-opacity="0"/></radialGradient>
    <pattern id="windows" width="25" height="20" patternUnits="userSpaceOnUse"><rect width="25" height="20" fill="#a69b87"/><rect x="5" y="4" width="10" height="7" fill="#f2d69a" opacity=".75"/></pattern>
    <pattern id="waterLines" width="70" height="28" patternUnits="userSpaceOnUse"><path d="M0 13c17-8 36-8 70 0" fill="none" stroke="#7194a0" stroke-width="2" opacity=".3"/></pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="8"/></filter>
    <symbol id="yacht" viewBox="0 -70 150 140">
      <path d="M0 34h143l-25 31H22z" fill="#e8e4d6" stroke="#66737a" stroke-width="3"/>
      <rect x="39" y="6" width="62" height="29" rx="5" fill="#e8e4d6" stroke="#66737a" stroke-width="3"/>
      <path d="M69 6V-63M73-49l42 47H73z" fill="#b9c5c5" stroke="#66737a" stroke-width="3"/>
      <path d="M11 51h112" stroke="#d5bd7d" stroke-width="3"/>
    </symbol>
    <symbol id="armco" viewBox="0 0 180 50">
      <path d="M0 9h180M0 24h180M0 39h180" stroke="#d8d5c9" stroke-width="7"/>
      <path d="M15 3v45M55 3v45M95 3v45M135 3v45M175 3v45" stroke="#6d7472" stroke-width="5"/>
    </symbol>
  </defs>

  <rect width="1600" height="1100" fill="url(#sky)"/><rect width="1600" height="1100" fill="url(#sunset)"/>
  <path d="M0 475L132 397l110 18 92-94 126 35 91-109 123 31 83-94 129 68 94-83 126 98 101-35 107 112 136 22 100 100v243H0z" fill="#34423f"/>
  <path d="M0 529l171-74 137 23 144-88 151 28 166-92 151 32 154-72 164 88 170-32 212 119v256H0z" fill="#53605a" opacity=".78"/>

