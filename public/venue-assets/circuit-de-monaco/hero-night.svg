  <g stroke="#554f47" stroke-width="3">
    <path d="M49 423h149v232H49zM218 385h123v255H218zM356 351h151v315H356zM525 405h115v236H525zM655 312h170v351H655zM842 362h129v301H842zM988 282h181v392H988zM1187 370h144v296h-144zM1347 342h194v354h-194z" fill="url(#city)"/>
    <path d="M72 454h105v178H72zM239 415h81v201h-81zM380 385h103v252H380zM681 345h117v288H681zM1014 319h128v318h-128zM1211 402h96v236h-96zM1372 379h143v278h-143z" fill="url(#windows)"/>
