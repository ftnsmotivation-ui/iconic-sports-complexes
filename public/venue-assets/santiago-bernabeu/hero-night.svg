    <linearGradient id="pitch" x2="0" y2="1"><stop stop-color="#3f765c"/><stop offset="1" stop-color="#102c28"/></linearGradient>
    <pattern id="ribs" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="skewX(-18)"><path d="M2 0v18" stroke="#f0ead2" stroke-width="5" opacity=".52"/></pattern>
