<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" role="img" aria-labelledby="title desc">
  <title id="title">Santiago Bernabéu architectural study</title>
  <desc id="desc">Original vector illustration of the stadium's luminous wrapped facade on the Paseo de la Castellana.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#07131c"/><stop offset="1" stop-color="#24434a"/></linearGradient>
    <linearGradient id="shell" x2="0" y2="1"><stop stop-color="#d6d3c2"/><stop offset=".5" stop-color="#777f7b"/><stop offset="1" stop-color="#303b3c"/></linearGradient>
    <linearGradient id="pitch" x2="0" y2="1"><stop stop-color="#3f765c"/><stop offset="1" stop-color="#102c28"/></linearGradient>
    <pattern id="ribs" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="skewX(-18)"><path d="M2 0v18" stroke="#f0ead2" stroke-width="5" opacity=".52"/></pattern>
  </defs>
  <rect width="800" height="700" fill="url(#sky)"/>
  <circle cx="642" cy="116" r="62" fill="#d5c48f" opacity=".16"/>
  <g fill="#14252b" opacity=".78"><path d="M0 280h92V151h49v129h63V112h56v168h71V169h43v111h426v160H0z"/></g>
  <!-- The rebuilt Bernabeu reads as a luminous, asymmetric city block rather than a generic bowl. -->
  <path d="M72 550 96 320Q103 258 172 240L594 215Q682 215 704 298L730 550Z" fill="#162529" stroke="#c6b77c" stroke-width="4"/>
  <path d="M103 520 122 326Q127 283 181 270L586 244Q659 244 676 307L701 520Z" fill="url(#shell)"/>
  <path d="M103 520 122 326Q127 283 181 270L586 244Q659 244 676 307L701 520Z" fill="url(#ribs)" opacity=".46"/>
  <!-- Layered stainless-steel ribbons sweep around the new facade. -->
  <g fill="none" stroke-linecap="round">
    <path d="M117 333Q383 271 680 308" stroke="#eee8d4" stroke-width="14" opacity=".9"/>
    <path d="M112 373Q390 311 687 349" stroke="#8f9996" stroke-width="12" opacity=".96"/>
    <path d="M108 414Q394 355 692 391" stroke="#e0dac6" stroke-width="13" opacity=".84"/>
    <path d="M105 455Q400 400 697 434" stroke="#6d7876" stroke-width="11" opacity=".94"/>
    <path d="M104 492Q405 447 699 473" stroke="#d5cfbc" stroke-width="9" opacity=".7"/>
  </g>
  <!-- Four glazed circulation towers are a defining part of the stadium elevation. -->
  <g fill="#14272d" stroke="#d7ca9c" stroke-width="4">
    <path d="M132 301h49l12 208h-79z"/><path d="M213 278h42l8 223h-69z"/>
    <path d="M590 253h43l25 248h-70z"/><path d="M650 280h35l21 229h-62z"/>
  </g>
  <g stroke="#82918f" stroke-width="3">
    <path d="M137 334h48M133 370h54M129 407h61M124 446h68"/><path d="M218 315h39M215 352h43M211 390h49M207 430h55"/>
    <path d="M594 294h43M597 334h44M600 376h46M604 419h47"/><path d="M655 318h34M658 355h35M661 394h36M665 436h35"/>
  </g>
  <!-- The retractable roof aperture and deep green pitch remain visible from the boulevard. -->
  <path d="M168 289Q395 204 635 265L607 326Q397 276 191 343Z" fill="#08151a" stroke="#d8cc9b" stroke-width="5"/>
  <path d="M211 294Q398 238 590 277L570 306Q397 275 229 321Z" fill="url(#pitch)"/>
  <path d="m400 256-1 55M224 307l353-15M350 263l-2 48M451 251l2 60" stroke="#d9e2c5" opacity=".38"/>
  <g fill="#d7c784"><rect x="136" y="470" width="528" height="5"/><rect x="159" y="491" width="482" height="3" opacity=".65"/></g>
  <path d="M0 558h800v142H0z" fill="#10191c"/><path d="M0 585h800M0 635h800" stroke="#d1bd76" stroke-width="2" opacity=".6"/>
  <path d="M165 558 92 700M635 558l73 142" stroke="#58615d" stroke-width="5"/><path d="M392 558v142" stroke="#dfd6b5" stroke-width="3" stroke-dasharray="19 18"/>
  <g fill="#d4c787" opacity=".7"><circle cx="151" cy="589" r="3"/><circle cx="265" cy="589" r="3"/><circle cx="535" cy="589" r="3"/><circle cx="649" cy="589" r="3"/></g>
</svg>
